name: Build full anonymized email corpus

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-full-anonymized-corpus.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download, verify and anonymize source corpus
        shell: python
        run: |
          from pathlib import Path
          import hashlib, re, urllib.request

          SOURCE_URL = 'https://gist.githubusercontent.com/BiggerThanTheMall/ed3677e5396db3a07e74f98fb523b3a4/raw/exemples-emails.txt'
          EXPECTED_SHA256 = 'e02aab54175682a4232d9f9e36ff9a7b3c8e89ef8fecb9555a07a256fea7ec86'

          raw = urllib.request.urlopen(SOURCE_URL, timeout=30).read()
          actual = hashlib.sha256(raw).hexdigest()
          if actual != EXPECTED_SHA256:
              raise SystemExit(f'Source corpus mismatch: expected {EXPECTED_SHA256}, got {actual}')

          text = raw.decode('utf-8', errors='replace')
          original_lines = len(text.splitlines())

          names = [
              'Renaud Mathieu','Nicolas Gonçalves','Nicolas Concalves','Alexandra Benhamou','Alexandra BENHAMOU','Alexandra Benhamu',
              'Karima BENMANSOUR','Latifa AKIL','Bachir MOULOUD','Fabrice GARNIER','Esther CHMBRAGNE','Esther CHAMBRAGNE',
              'BENSAADA Mohammed','BEKTHI Aicha','BOULANOUAR Saadia','SMAINE Houria','SMAINE Bouazza','IBAZ Ahmed',
              'Boudjema BECHIRI','BOUDJEMA BECHIRI','HACHANI Hamza','BOUNIF Zerebia','BENNEDIF Khedidja','Leila DAOUD',
              'El Mokhtar ADDOU','LOANN POMMIER','Stephane LORIVEL','Stéphane LORIVEL','Martin Brosse','Martin','Claude','Alexandra','Esther','BROSSE, MARTIN','DAOUD Kheira',
              'BENKACEM Abdelkrim','Benkacem Abdelkrim','Benkacem Barkaboum','BENKACEM Barkaboum','BENKACEM Malika','Benkacem Malika',
              'FOUHAL, SALAH','BERROUANE, ANISSA','MICHALOPOULOS, VASILEIOS','YEKHLEF, EL HADJ','BELBACHIR, SARHA',
              'MADANI, FATIMA','LACHAAL, EL HOUARI','HOLTZMANN, CLAUDE','LORIVEL, STEPHANE','GARNIER, FABRICE','MOULOUD, BACHIR',
              'DERDOUR, HAMED','DERDOUR, KHEIRA','BEKKALI, AMINA','AKIL, LATIFA','POMMIER, LOANN',
              'Ghaïs KALAH','Ghais KALAH','GHais KALAH','GHais','Ghaïs','Ghais','Ghjais','Nadia KALAH','Nadia Kalah','Nadia',
              'Louli VULLIOD','Sheana','Eddy','Hanane','HANANE','Tom','Régis','Regis','Josselin','Stéphanie','stephanie','Parfat','Fabien',
              'Sara.B','Dude','Cherif','Cheif','Lazare','LAZARE','Michalopoulos','Derdour','Bouaziz','BOUAZIZ','LARABI','DEKKAL','BENRABAH',
              'BALUT','Bertacchi','LE MAOUT','PENOUHET','Garnier','GARNIER','BENMANSOUR','BOUGUETTOUF','HCMABRAGNE','LACHAAL','LEMNOUAR',
              'LORIVEL','NASRALLAH','CELLUPICA','Teste','Chambragne','ADJERIME','IBAZ','BOUDJEMA BECHIRI','Mme LOANN POMMIER'
          ]

          for i, name in enumerate(sorted(set(names), key=len, reverse=True), 1):
              text = re.sub(r'(?<![\wÀ-ÿ])' + re.escape(name) + r'(?![\wÀ-ÿ])', f'[PERSONNE_{i:03d}]', text, flags=re.I)

          text = re.sub(r'\b(Monsieur|Madame|Mme|M\.)[ \t]+([A-ZÀ-ÖØ-Þ][A-Za-zÀ-ÖØ-öø-ÿ\'’-]+(?:[ \t]+[A-ZÀ-ÖØ-Þ][A-Za-zÀ-ÖØ-öø-ÿ\'’-]+){0,2})', r'\1 [PERSONNE]', text)
          text = re.sub(r'(?i)(\b(?:né|née)\s+le\s+)\d{1,2}[/-]\d{1,2}[/-](?:19|20)\d{2}', r'\1[DATE_NAISSANCE]', text)
          text = re.sub(r'(?i)(\b(?:né|née)\s+en\s+)\d{1,2}[/-](?:19|20)\d{2}', r'\1[MOIS_ANNEE_NAISSANCE]', text)
          text = re.sub(r'(?i)(date de naissance\s*[:,-]?[ \t]*)\d{1,2}[/-]\d{1,2}[/-](?:19|20)\d{2}', r'\1[DATE_NAISSANCE]', text)
          text = re.sub(r'(?i)(\b(?:décédé|décédée|decede|decedee|decedé|décéde)\s+le[ \t]+)\d{1,2}[/-]\d{1,2}[/-](?:19|20)\d{2}', r'\1[DATE_DECES]', text)
          text = re.sub(r'(?i)(quotité\s+)\d{1,3}\s*%', r'\1[QUOTITE]', text)

          text = re.sub(r'\b[A-Z]{2}-?\d{3}-?[A-Z]{2}\b', '[IMMATRICULATION]', text)
          text = re.sub(r'\b(?:AUT|GAV)\d{6,}\b', '[REFERENCE_CONTRAT]', text, flags=re.I)
          text = re.sub(r'\bECA[A-Z0-9]{5,}\b', '[REFERENCE_CONTRAT]', text, flags=re.I)
          text = re.sub(r'(?i)(référence\s+client\s+(?:qui\s+est\s+de\s+|[:=]?[ \t]*))\d{6,}', r'\1[REFERENCE_CLIENT]', text)
          text = re.sub(r'(?i)(\bref[ \t]*:[ \t]*)[A-Z0-9-]{6,}', r'\1[REFERENCE_CONTRAT]', text)
          text = re.sub(r'\b014069196E\b', '[REFERENCE_CONTRAT]', text, flags=re.I)
          text = re.sub(r'\b01[ \t]+40[ \t]+69[ \t]+19[ \t]+6[ \t]+E\b', '[REFERENCE_CONTRAT]', text, flags=re.I)
          text = re.sub(r'(?<!\d)(?:\+33\s?|0)[1-9](?:[ .-]?\d{2}){4}(?!\d)', '[TELEPHONE]', text)
          text = re.sub(r'\b(?:33)?[1-9]\d{8,10}\b', '[TELEPHONE_OU_ID]', text)
          text = re.sub(r'\bFR\d{2}(?:\s?[A-Z0-9]{4}){5}\s?[A-Z0-9]{3}\b', '[IBAN]', text, flags=re.I)
          text = re.sub(r'(?i)(\bBIC[ \t]*[:=]?[ \t]*)[A-Z0-9]{8,11}\b', r'\1[BIC]', text)
          text = re.sub(r'\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b', '[EMAIL]', text, flags=re.I)

          text = re.sub(r'(?i)bâtiment\s+[A-Z0-9]+,\s*résidence\s+[A-Z0-9’\' -]+,\s*à\s+[A-ZÀ-ÖØ-öø-ÿ -]+', '[ADRESSE]', text)
          text = re.sub(r'(?i)TSA\s+\d+(?:\s+\d+){1,3}\s+[A-ZÀ-ÖØ-öø-ÿ -]+Cedex\s*\d*', '[ADRESSE_ASSUREUR]', text)
          text = re.sub(r'(?i)avenue\s+Ambroise\s+Paré(?:,?\s+à)?\s+Cannes', '[ADRESSE_BANQUE]', text)
          text = re.sub(r'(?i)avenue\s+Ambroise\s+Paré,?\s*Cannes', '[ADRESSE_BANQUE]', text)

          text = text.replace('217 000 euros', '[MONTANT_CAPITAL]')
          text = text.replace('217 000 de capital', '[MONTANT_CAPITAL] de capital')
          text = text.replace('154 050 euros', '[MONTANT_NANTISSEMENT]')
          text = text.replace('154 050', '[MONTANT_NANTISSEMENT]')
          text = re.sub(r'(?i)le\s+5\s+septembre\s+2017', 'le [DATE_EFFET_CONTRAT]', text)

          if len(text.splitlines()) != original_lines:
              raise SystemExit(f'Line count changed: source={original_lines}, output={len(text.splitlines())}')

          residual_patterns = {
              'email': r'\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b',
              'long numeric id': r'\b\d{9,12}\b',
              'vehicle plate': r'\b[A-Z]{2}-?\d{3}-?[A-Z]{2}\b',
              'IBAN': r'\bFR\d{2}(?:\s?[A-Z0-9]{4}){5}\s?[A-Z0-9]{3}\b'
          }
          for label, pattern in residual_patterns.items():
              if re.search(pattern, text, re.I):
                  raise SystemExit(f'Residual sensitive pattern found: {label}')

          Path('exemples-emails-anonymises.txt').write_text(text, encoding='utf-8')

          script = Path('Modulr_-_Correcteur_Email_Gemini.user.js')
          s = script.read_text(encoding='utf-8')
          s = s.replace('// @version      3.3.7', '// @version      3.3.8', 1)
          s = s.replace("GM_getValue('exemples_cache', '')", "GM_getValue('exemples_cache_full_v2', '')")
          s = s.replace("GM_getValue('exemples_cache_time', 0)", "GM_getValue('exemples_cache_full_v2_time', 0)")
          s = s.replace("GM_setValue('exemples_cache', response.responseText)", "GM_setValue('exemples_cache_full_v2', response.responseText)")
          s = s.replace("GM_setValue('exemples_cache_time', now)", "GM_setValue('exemples_cache_full_v2_time', now)")
          script.write_text(s, encoding='utf-8')

      - name: Commit corpus and script update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exemples-emails-anonymises.txt Modulr_-_Correcteur_Email_Gemini.user.js
          git diff --cached --quiet && exit 0
          git commit -m "Use full anonymized email corpus in Gemini corrector"
          git push
